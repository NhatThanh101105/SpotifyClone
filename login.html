<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png" />
  <title>Log in - Spotify</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body class="bg-[#121212] text-white font-sans min-h-screen flex flex-col items-center pt-8 pb-16">
  <!-- Container -->
  <div class="w-full max-w-[324px] mx-auto flex flex-col mt-8">

    <!-- Header -->
    <div class="flex flex-col items-center mb-8">
      <!-- Spotify Logo -->
      <a href="/" class="mb-8 hover:scale-105 transition-transform">
        <svg viewBox="0 0 24 24" class="h-10 w-10 text-white fill-current">
          <path
            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.539-1.56.299z" />
        </svg>
      </a>
      <h1 class="text-4xl font-bold tracking-tight text-center leading-tight">Welcome back</h1>
    </div>

    <!-- Form Area -->
    <form id="login-form" class="flex flex-col w-full gap-4">

      <div class="flex flex-col gap-2">
        <label for="email" class="text-[14px] font-bold">Email</label>
        <input type="email" id="email" placeholder="Email address"
          class="w-full bg-[#121212] border border-[#727272] rounded-[4px] px-3.5 py-3 text-[16px] placeholder:text-[#b3b3b3] hover:border-white focus:border-white focus:outline-none transition-colors"
          required />
      </div>

      <div class="flex flex-col gap-2 mt-2">
        <label for="password" class="text-[14px] font-bold">Password</label>
        <input type="password" id="password" placeholder="Password"
          class="w-full bg-[#121212] border border-[#727272] rounded-[4px] px-3.5 py-3 text-[16px] placeholder:text-[#b3b3b3] hover:border-white focus:border-white focus:outline-none transition-colors"
          required />
      </div>

      <button id="login-btn" type="submit"
        class="w-full bg-[#1ed760] text-black font-bold text-[16px] rounded-full py-3.5 mt-4 hover:bg-[#3be477] hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        Log In
      </button>

    </form>

    <!-- Divider -->
    <div class="flex items-center my-8 w-full">
      <div class="flex-grow bg-[#292929] h-[1px]"></div>
      <span class="px-4 text-[14px] text-white">or</span>
      <div class="flex-grow bg-[#292929] h-[1px]"></div>
    </div>

    <!-- Social Login -->
    <div class="flex flex-col gap-3 w-full">

      <button
        class="relative flex items-center w-full bg-transparent border border-[#727272] hover:border-white rounded-full py-3 px-8 transition-colors">
        <svg viewBox="0 0 24 24" class="h-6 w-6 absolute left-6 fill-current text-white">
          <path
            d="M15 4H9V2h6v2zm-3 15a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm5-17H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H7V4h10v16z" />
        </svg>
        <span class="flex-1 text-center font-bold text-[15px]">Continue with phone number</span>
      </button>

      <button
        class="relative flex items-center w-full bg-transparent border border-[#727272] hover:border-white rounded-full py-3 px-8 transition-colors">
        <svg viewBox="0 0 24 24" class="h-5 w-5 absolute left-6">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        <span class="flex-1 text-center font-bold text-[15px]">Continue with Google</span>
      </button>

      <button
        class="relative flex items-center w-full bg-transparent border border-[#727272] hover:border-white rounded-full py-3 px-8 transition-colors">
        <svg viewBox="0 0 24 24" class="h-6 w-6 absolute left-6">
          <path fill="#1877F2"
            d="M23.998 12c0-6.628-5.372-12-11.999-12C5.372 0 0 5.372 0 12c0 5.988 4.388 10.952 10.124 11.852v-8.384H7.078v-3.469h3.046V9.356c0-3.008 1.792-4.669 4.532-4.669 1.313 0 2.686.234 2.686.234v2.953H15.83c-1.49 0-1.955.925-1.955 1.874V12h3.328l-.532 3.469h-2.796v8.384c5.736-.9 10.124-5.864 10.124-11.853z" />
          <path fill="#FFF"
            d="M16.671 15.469L17.203 12h-3.328V9.749c0-.949.465-1.874 1.955-1.874h1.513V4.922s-1.373-.234-2.686-.234c-2.74 0-4.532 1.66-4.532 4.669V12H7.078v3.469h3.046v8.384a12.029 12.029 0 0 0 3.751 0v-8.384h2.796z" />
        </svg>
        <span class="flex-1 text-center font-bold text-[15px]">Continue with Facebook</span>
      </button>

      <button
        class="relative flex items-center w-full bg-transparent border border-[#727272] hover:border-white rounded-full py-3 px-8 transition-colors">
        <svg viewBox="0 0 24 24" class="h-6 w-6 absolute left-6 fill-current text-white">
          <path
            d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.641-.026 2.62-1.468 3.62-2.924 1.157-1.696 1.636-3.342 1.656-3.428-.035-.015-3.208-1.233-3.236-4.947-.027-3.109 2.535-4.606 2.651-4.68-.148-2.193-1.688-4.225-3.91-4.48-1.782-.246-3.524 1.144-4.246 1.144-.737 0-2.157-1.127-3.82-1.152v.004H12.152zM15.545 4.14c.813-.984 1.36-2.35.197-3.715-1.14.048-2.6.764-3.439 1.748-.755.885-1.4 2.28-.198 3.639 1.258.118 2.518-.62 3.44-1.672z" />
        </svg>
        <span class="flex-1 text-center font-bold text-[15px]">Continue with Apple</span>
      </button>

    </div>

    <!-- Footer login link -->
    <div class="mt-12 flex items-center justify-center gap-2 mb-8">
      <span class="text-[#b3b3b3] text-[15px]">Don't have an account?</span>
      <a href="/signup.html"
        class="text-white hover:text-[#1ed760] font-bold text-[15px] underline hover:no-underline transition-colors">Sign
        up for Spotify</a>
    </div>

  </div>

  <!-- JS for Auth functionality later -->
  <script type="module" src="./src/auth.js"></script>
</body>

</html>
